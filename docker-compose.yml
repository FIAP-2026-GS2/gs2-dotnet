services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sampatech-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Emulador do Azure Blob Storage: guarda as fotos dos cidadãos no ambiente local.
  # Usa a conta pública de desenvolvimento (UseDevelopmentStorage=true), que não é segredo.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: sampatech-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  sqlserver-data:
  azurite-data:
